<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>¡Gracias! · devsChile</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Fira+Sans:400,700">
  <style>
    :root { --bg:#111827; --fg:#e5e7eb; --accent:#2dd4bf; --white:#fff; --tile-h:9rem; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); font-family:"Fira Sans","Helvetica Neue",sans-serif; }
    body { min-height:100vh; min-height:100dvh; overflow-x:hidden; display:flex; align-items:center; justify-content:center; padding:1rem; }
    #bg { position:fixed; inset:0; z-index:0; overflow:hidden; display:flex; flex-direction:column; gap:.5rem; }
    #bg::after { content:""; position:absolute; inset:0; background:rgba(17,24,39,.55); }
    .row { flex:none; height:var(--tile-h); overflow:hidden; white-space:nowrap; }
    .row .track { display:inline-flex; gap:.5rem; height:100%; animation:slide 60s linear infinite; }
    .row:nth-child(even) .track { animation-direction:reverse; }
    .tile { flex:none; width:12rem; height:100%; border-radius:6px; background-size:cover; background-position:center; }
    @keyframes slide { to { transform:translateX(-50%); } }

    #fireworks { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }

    main { position:relative; z-index:2; width:100%; max-width:40rem; padding:2.5rem 1.5rem; text-align:center;
           background:rgba(17,24,39,.82); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5);
           -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
    h1 { color:var(--white); font-size:clamp(2.2rem,7vw,3.4rem); margin:0 0 1rem; }
    p { font-size:1.15rem; line-height:1.5; margin:0 0 1rem; }
    .btn { display:inline-block; margin:1rem 0 0; padding:1rem 2rem; background:var(--accent); color:var(--white);
           font-size:1.25rem; text-transform:uppercase; text-decoration:none; text-shadow:1px 1px #555; border-radius:4px;
           transition:transform .15s; }
    .btn:hover, .btn:focus-visible { transform:scale(1.06) rotate(-1deg); outline:2px solid var(--white); outline-offset:3px; }

    @media (prefers-reduced-motion: reduce) { .row .track { animation:none; } }
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <main>
    <h1>¡Listo!</h1>
    <p>Ya quedó tu respuesta. Gracias por tomarte el tiempo: con lo que nos cuentan entre todos podemos conversar con datos en la mano y mejorar el mundo.</p>
    <p>Si aún no estás en la comunidad, súmate: somos devs compartiendo pegas, dudas y memes.</p>
    <a id="slack" class="btn" href="https://join.slack.com/t/devschile/shared_invite/zt-4ba97hsrp-~fXfswNFkS4jdX2Z0gPhuQ" rel="noopener">Únete a Slack</a>
  </main>

  <script>
    // Link de invitación a Slack (el mismo de la home, VITE_SLACK_INVITE_LINK).
    var SLACK_INVITE = "https://join.slack.com/t/devschile/shared_invite/zt-4ba97hsrp-~fXfswNFkS4jdX2Z0gPhuQ";
    var GIFS = [
      "/gracias/giphy.gif", "/gracias/giphy-1.gif", "/gracias/giphy-2.gif", "/gracias/giphy-3.gif",
      "/gracias/giphy-4.gif", "/gracias/giphy-5.gif", "/gracias/giphy-6.gif", "/gracias/giphy-7.gif"
    ];

    document.getElementById("slack").href = SLACK_INVITE;

    (function background() {
      var bg = document.getElementById("bg");
      var tileH = parseFloat(getComputedStyle(document.documentElement).fontSize) * 9;
      var rows = Math.ceil(innerHeight / (tileH + 8)) + 1;
      for (var r = 0; r < rows; r++) {
        var row = document.createElement("div"), track = document.createElement("div");
        row.className = "row"; track.className = "track";
        // cada fila arranca en un GIF distinto; la lista se repite para llenar el ancho y el loop de -50% es continuo
        var shift = r % GIFS.length;
        var order = GIFS.slice(shift).concat(GIFS.slice(0, shift));
        var half = [];
        while (half.length * 12.5 * 16 < innerWidth + 400 || half.length < GIFS.length) half = half.concat(order);
        half.concat(half).forEach(function (src) {
          var t = document.createElement("div");
          t.className = "tile"; t.style.backgroundImage = 'url("' + src + '")';
          track.appendChild(t);
        });
        row.appendChild(track); bg.appendChild(row);
      }
    })();

    (function fireworks() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var c = document.getElementById("fireworks"), ctx = c.getContext("2d");
      var parts = [], W, H;
      function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
      addEventListener("resize", resize); resize();

      function burst(x, y) {
        var hue = Math.random() * 360;
        for (var i = 0; i < 70; i++) {
          var a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
          parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: hue + Math.random() * 40 });
        }
      }
      setInterval(function () { burst(Math.random() * W, Math.random() * H * 0.6); }, 700);
      addEventListener("pointerdown", function (e) { burst(e.clientX, e.clientY); });
      burst(W / 2, H / 3);

      (function frame() {
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";
        parts = parts.filter(function (p) { return p.life > 0.02; });
        parts.forEach(function (p) {
          p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.vx *= 0.985; p.life *= 0.975;
          ctx.fillStyle = "hsla(" + p.hue + ",100%,60%," + p.life + ")";
          ctx.fillRect(p.x, p.y, 2.5, 2.5);
        });
        requestAnimationFrame(frame);
      })();
    })();
  </script>
</body>
</html>
